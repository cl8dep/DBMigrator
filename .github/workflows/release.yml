name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset_name: db-migrator-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            asset_name: db-migrator-linux-arm64
          - os: macos-latest
            rid: osx-x64
            asset_name: db-migrator-macos-x64
          - os: macos-latest
            rid: osx-arm64
            asset_name: db-migrator-macos-arm64
          - os: windows-latest
            rid: win-x64
            asset_name: db-migrator-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained binary
        run: >
          dotnet publish src/DbMigrator
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o out/${{ matrix.rid }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: mv out/${{ matrix.rid }}/db-migrator out/${{ matrix.rid }}/${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: Rename-Item out/${{ matrix.rid }}/db-migrator.exe ${{ matrix.asset_name }}
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: out/${{ matrix.rid }}/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: db-migrator-*

      - name: Make Unix binaries executable
        run: |
          chmod +x artifacts/db-migrator-linux-x64/db-migrator-linux-x64
          chmod +x artifacts/db-migrator-linux-arm64/db-migrator-linux-arm64
          chmod +x artifacts/db-migrator-macos-x64/db-migrator-macos-x64
          chmod +x artifacts/db-migrator-macos-arm64/db-migrator-macos-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/db-migrator-linux-x64/db-migrator-linux-x64
            artifacts/db-migrator-linux-arm64/db-migrator-linux-arm64
            artifacts/db-migrator-macos-x64/db-migrator-macos-x64
            artifacts/db-migrator-macos-arm64/db-migrator-macos-arm64
            artifacts/db-migrator-windows-x64.exe/db-migrator-windows-x64.exe

  docker:
    name: Publish Docker image to ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dbmigrator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
